[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-toolkit"
version = "1.0.0"
description = "Professional prompt library and generator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Prompt Toolkit Contributors"}]
dependencies = [
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
prompt-toolkit = "prompt_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
